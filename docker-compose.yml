# =============================================================================
# docker-compose.yml — CRED10MIX Gestão de Seguros
# =============================================================================
# Inicia o frontend (nginx) e o backend (PocketBase) juntos.
#
# Uso:
#   docker compose up -d --build
#
# O frontend estará disponível em http://localhost:5173
# O PocketBase (Admin + API) em http://localhost:8090
# =============================================================================

services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    ports:
      - '8090:8090'
    volumes:
      - pb_data:/pb/pb_data
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      - SITE_URL=${SITE_URL:-http://localhost:5173}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_POCKETBASE_URL=http://127.0.0.1:8090
    ports:
      - '5173:80'
    depends_on:
      - pocketbase
    restart: unless-stopped

volumes:
  pb_data:
